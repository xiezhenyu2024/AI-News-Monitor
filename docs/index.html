<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>新闻问答</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;max-width:820px;margin:0 auto;background:#f7f7f8;color:#222}
#home{padding:14px}
#chat{display:none;height:100dvh;flex-direction:column}
#swipeWrap{display:flex;flex-direction:column;flex:1;min-height:0;touch-action:pan-y;will-change:transform}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
h2{margin:0;font-size:18px}
select{flex:1;min-width:180px;padding:8px;font-size:14px;border:1px solid #ddd;border-radius:8px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer;overflow:hidden}
.gcard h3{margin:0 0 6px;font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gcard p{margin:0;font-size:11px;line-height:1.5;color:#555;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gcard .tag{display:inline-block;margin-top:6px;font-size:10px;color:#0b57d0;background:#eef3fd;border-radius:4px;padding:2px 6px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loading{color:#888;font-size:13px;text-align:center;padding:30px}
/* 对话页 */
.chatbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0;z-index:10}
.chatbar button{background:none;border:none;font-size:20px;cursor:pointer;color:#0b57d0;padding:4px 8px}
.chatbar .ctitle{font-size:13px;color:#888;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cardinfo{padding:12px 14px;background:#fff;border-bottom:1px solid #eee;max-height:38dvh;overflow-y:auto}
.cardinfo h3{margin:0 0 6px;font-size:15px}
.cardinfo p{font-size:12px;line-height:1.6;margin:4px 0}
.cardinfo .ent{font-size:12px;color:#444;background:#f4f6fa;border-radius:6px;padding:6px 10px;margin:4px 0}
.cardinfo .rel{color:#0b57d0;font-size:12px}
#msgs{flex:1;overflow-y:auto;padding:12px 14px}
.msg{margin:8px 0;padding:10px 12px;border-radius:8px;font-size:14px;line-height:1.7;white-space:pre-wrap;max-width:92%}
.user{background:#0b57d0;color:#fff;margin-left:auto;border-bottom-right-radius:2px}
.ai{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.06);border-bottom-left-radius:2px}
.thinking{color:#888;font-style:italic}
.thinking::after{content:'';animation:dots 1.2s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'•'}50%{content:'••'}75%{content:'•••'}}
.inputrow{display:flex;gap:8px;padding:10px 14px;background:#fff;border-top:1px solid #eee}
input{flex:1;padding:10px;font-size:14px;border:1px solid #ddd;border-radius:8px}
button{padding:10px 18px;font-size:14px;background:#0b57d0;color:#fff;border:none;border-radius:8px;cursor:pointer;transition:transform .1s,opacity .15s}
button:active{transform:scale(.93)}
button.sending{opacity:.6;pointer-events:none}
.hint{color:#888;font-size:12px;margin:4px 0 10px}
.sbar{margin-bottom:12px}
.dtabs{display:flex;gap:6px;margin-bottom:12px}
.dtabs button{flex:1;padding:9px;font-size:14px;border:1px solid #ddd;border-radius:8px;background:#fff;cursor:pointer;color:#333}
.dtabs button.on{background:#0b57d0;color:#fff;border-color:#0b57d0}
.slist{margin-bottom:12px}
.sitem{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:11px 14px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);cursor:pointer}
.sitem .sdot{width:8px;height:8px;border-radius:50%;background:#0b57d0;flex-shrink:0}
.sitem .sname{font-size:14px;font-weight:600;color:#222}
.sitem .stime{font-size:12px;color:#888;margin-left:auto}
.sgroup{font-size:13px;color:#888;margin:12px 0 8px;font-weight:600}
.modebar{display:flex;gap:6px;padding:8px 14px;background:#f0f4fb;border-bottom:1px solid #eee}
.modebar button{flex:1;padding:7px;font-size:13px;border:1px solid #ccd;border-radius:8px;background:#fff;cursor:pointer;color:#333;transition:background .2s,color .2s,transform .1s}
.modebar button:active{transform:scale(.95)}
.modebar button.on{background:#0b57d0;color:#fff;border-color:#0b57d0}
</style>
</head>
<body>
<div id="home">
  <div class="top">
    <h2>📰 新闻问答</h2>
  </div>
  <div class="dtabs">
    <button id="tabToday" class="on" onclick="switchDayTab('today')">今日</button>
    <button id="tabHist" onclick="switchDayTab('hist')">历史</button>
  </div>
  <div id="listToday" class="slist"></div>
  <div id="listHist" class="slist" style="display:none"></div>
  <div class="sbar">
    <input id="skw" placeholder="🔍 搜索新闻（输入关键词补充查询）" onkeydown="if(event.key==='Enter')doSearch()">
  </div>
  <div id="sres" class="hint"></div>
  <div id="grid" class="grid"></div>
</div>

<div id="chat">
  <div id="swipeWrap">
    <div class="chatbar">
      <button onclick="goHome()">←</button>
      <span class="ctitle" id="ctitle"></span>
    </div>
    <div class="modebar">
      <button id="modeLight" class="on" onclick="setMode('light')">💡 轻度</button>
      <button id="modeDeep" onclick="setMode('deep')">🧠 深度</button>
    </div>
    <div class="cardinfo" id="cardinfo"></div>
    <div id="msgs"></div>
  </div>
  <div class="inputrow">
    <input id="q" placeholder="问这条新闻…" onkeydown="if(event.key==='Enter')ask()">
    <button id="sendBtn" onclick="ask()">发送</button>
  </div>
</div>

<script>
const KEYS = ["2026-08-24-morning", "2026-08-24-evening", "2026-08-24-afternoon", "2026-08-23-morning", "2026-08-23-evening", "2026-08-23-afternoon", "2026-08-22-morning", "2026-08-22-evening", "2026-08-22-afternoon", "2026-08-21-morning", "2026-08-21-evening", "2026-08-21-afternoon", "2026-08-20-morning", "2026-08-20-evening", "2026-08-20-afternoon"];
const API = "https://1471673999-3ypqvp16ev.ap-guangzhou.tencentscf.com";
let ctx = null;          // 当前期 context
let curCard = null;      // 当前对话的卡片 {ctxKey, idx}
let curMsgs = [];        // 当前卡对话历史
let pendingCards = {};   // 正在请求中的卡片: key=ctxKey_idx -> true
let qaMode = 'light';    // light=免费GLM  deep=DeepSeek+钢人论证

// ── 声音反馈（Web Audio 合成，零依赖，静默降级） ──
let audioCtx = null;
function playTone(freq, dur, type='sine', vol=0.06){
  try{
    if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    if(audioCtx.state==='suspended'){ audioCtx.resume(); }
    const t0 = audioCtx.currentTime;
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }catch(e){}
}
function playChime(){
  try{
    if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
    if(audioCtx.state==='suspended'){ audioCtx.resume(); }
    const t0 = audioCtx.currentTime;
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.06, t0 + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
    g.connect(audioCtx.destination);
    [1046, 1568].forEach(f=>{
      const o = audioCtx.createOscillator();
      o.type = 'sine'; o.frequency.value = f;
      o.connect(g);
      o.start(t0); o.stop(t0 + 0.4);
    });
  }catch(e){}
}

// ── 等待耗时统计（localStorage 持久化，隐私模式降级） ──
let latencyHist = null;
function loadLatency(){
  if(latencyHist) return latencyHist;
  try{
    latencyHist = JSON.parse(localStorage.getItem('newsqa_latency_hist') || '[]');
    if(!Array.isArray(latencyHist)) latencyHist = [];
  }catch(e){ latencyHist = []; }
  return latencyHist;
}
function avgLatency(){
  const h = loadLatency();
  if(!h.length) return null;
  const recent = h.slice(-5);
  return Math.round(recent.reduce((a,b)=>a+b,0) / recent.length);
}
function recordLatency(sec){
  try{
    const h = loadLatency();
    h.push(sec);
    if(h.length > 20) h.splice(0, h.length - 20);
    localStorage.setItem('newsqa_latency_hist', JSON.stringify(h));
  }catch(e){}
}

function setMode(m){
  qaMode = m;
  document.getElementById('modeLight').className = m==='light' ? 'on' : '';
  document.getElementById('modeDeep').className = m==='deep' ? 'on' : '';
}

// ── IndexedDB：每卡独立对话历史，保留2年 ──
let db = null;
function openDB(){
  return new Promise((resolve)=>{
    const req = indexedDB.open('newsqa_chat', 1);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('threads')){
        d.createObjectStore('threads', {keyPath:'id'});
      }
    };
    req.onsuccess = ()=>{ db = req.result; resolve(); };
    req.onerror = ()=>{ db = null; resolve(); };
  });
}
function threadId(ctxKey, idx){ return ctxKey + '|' + idx; }
function loadThread(id){
  return new Promise((resolve)=>{
    if(!db){ resolve([]); return; }
    const r = db.transaction('threads','readonly').objectStore('threads').get(id);
    r.onsuccess = ()=> resolve((r.result && r.result.msgs) || []);
    r.onerror = ()=> resolve([]);
  });
}
function saveThread(id, msgs){
  if(!db) return;
  const tx = db.transaction('threads','readwrite');
  const st = tx.objectStore('threads');
  st.put({id, msgs, updated: Date.now()});
  // 自动清理2年前的记录
  const cutoff = Date.now() - 730*24*3600*1000;
  const all = st.openCursor();
  all.onsuccess = (e)=>{
    const c = e.target.result;
    if(c){
      if(c.value.updated < cutoff) c.delete();
      c.continue();
    }
  };
}

// ── 主页：今日/历史 双栏 + 卡片网格 ──
const SESSION_LABEL = {morning:'☀️ 早报', afternoon:'🕐 午报', evening:'🌙 晚报'};
const SESSION_TIME = {morning:'07:30', afternoon:'14:00', evening:'21:40'};
let curKey = null;

function sessionInfo(key){
  // key 格式: YYYY-MM-DD-session
  const idx = key.lastIndexOf('-');
  const session = key.slice(idx+1);
  const date = key.slice(0, idx);
  return {date, session};
}

function todayStr(){
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear() + '-' + m + '-' + day;
}

function renderSessionLists(){
  const today = todayStr();
  const todayKeys = KEYS.filter(k=>k.startsWith(today));
  const histKeys = KEYS.filter(k=>!k.startsWith(today));

  // 今日栏
  const tl = document.getElementById('listToday');
  if(todayKeys.length){
    tl.innerHTML = todayKeys.map(k=>{
      const {session} = sessionInfo(k);
      return `<div class="sitem" onclick="pickKey('${k}')"><span class="sdot"></span><span class="sname">${SESSION_LABEL[session]||k}</span><span class="stime">${SESSION_TIME[session]||''}</span></div>`;
    }).join('');
  } else {
    tl.innerHTML = '<div class="hint">今日暂无报告，请查看历史或等待推送</div>';
  }

  // 历史栏：按日期分组
  const groups = {};
  histKeys.forEach(k=>{
    const {date, session} = sessionInfo(k);
    (groups[date] = groups[date] || []).push({k, session});
  });
  const dates = Object.keys(groups).sort().reverse();
  const hl = document.getElementById('listHist');
  if(dates.length){
    hl.innerHTML = dates.map(d=>{
      const items = groups[d].map(({k, session})=>
        `<div class="sitem" onclick="pickKey('${k}')"><span class="sdot"></span><span class="sname">${SESSION_LABEL[session]||session}</span><span class="stime">${SESSION_TIME[session]||''}</span></div>`
      ).join('');
      return `<div class="sgroup">${d}</div>${items}`;
    }).join('');
  } else {
    hl.innerHTML = '<div class="hint">暂无历史记录</div>';
  }
}

function switchDayTab(tab){
  document.getElementById('tabToday').className = tab==='today' ? 'on' : '';
  document.getElementById('tabHist').className = tab==='hist' ? 'on' : '';
  document.getElementById('listToday').style.display = tab==='today' ? '' : 'none';
  document.getElementById('listHist').style.display = tab==='hist' ? '' : 'none';
}

async function pickKey(key){
  curKey = key;
  const box = document.getElementById('grid');
  box.innerHTML = '<div class="loading">加载中…</div>';
  try{
    const r = await fetch('context-' + key + '.json', {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    ctx = await r.json();
    if(!ctx.cards || !ctx.cards.length){ box.innerHTML = '<div class="loading">该期无卡片数据</div>'; return; }
    box.innerHTML = ctx.cards.map((c,i)=>{
      const tag = (c.entities && c.entities[0]) ? c.entities[0].name : (c.relevant || '');
      const tagTxt = tag ? '<span class="tag">' + esc(tag) + '</span>' : '';
      return `<div class="gcard" onclick="openChat(${i})"><h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p>${tagTxt}</div>`;
    }).join('');
  }catch(e){
    box.innerHTML = '<div class="loading">加载失败: ' + esc(e.message) + '</div>';
  }
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── 对话页 ──
async function openChat(idx, skipVT){
  if(!ctx || !ctx.cards[idx]) return;
  curCard = {ctxKey: ctx.key, idx};
  const c = ctx.cards[idx];
  const doSwitch = async ()=>{
    document.getElementById('home').style.display = 'none';
    document.getElementById('chat').style.display = 'flex';
    document.getElementById('ctitle').textContent = (idx+1) + '/' + ctx.cards.length + ' · ' + ctx.key;
    const ents = (c.entities||[]).map(e=>`<div class="ent"><b>${esc(e.name)}</b>：${esc(e.explain)}</div>`).join('');
    const rel = c.relevant ? `<p class="rel">与你相关：${esc(c.relevant)}</p>` : '';
    document.getElementById('cardinfo').innerHTML =
      `<h3>#${idx+1} ${esc(c.title)}</h3>${ents}<p>${esc(c.summary)}</p>${rel}`;
    curMsgs = await loadThread(threadId(ctx.key, idx));
    curMsgs = curMsgs.map(m=>({role:(m.role==='ai'?'assistant':m.role), content:m.content}));
    const box = document.getElementById('msgs');
    box.innerHTML = '';
    curMsgs.forEach(m=>addMsg(m.role, m.content, false));
    box.scrollTop = box.scrollHeight;
  };
  if(document.startViewTransition && !skipVT){
    document.startViewTransition(doSwitch);
  } else {
    await doSwitch();
  }
}
function goHome(){
  const doSwitch = ()=>{
    document.getElementById('chat').style.display = 'none';
    document.getElementById('home').style.display = '';
    curCard = null;
  };
  if(document.startViewTransition){
    document.startViewTransition(doSwitch);
  } else {
    doSwitch();
  }
}

// ── 卡片滑动切换（手机端，拖拽跟手+吸附） ──
let swipe = null;
let swiping = false;    // 切换动画进行中，防并发重入
function initSwipe(){
  const wrap = document.getElementById('swipeWrap');
  if(!wrap) return;
  wrap.addEventListener('touchstart', (e)=>{
    const t = e.touches[0];
    swipe = {sx:t.clientX, sy:t.clientY, dx:0, dy:0, locked:false, active:false, t0:Date.now()};
  }, {passive:true});
  wrap.addEventListener('touchmove', (e)=>{
    if(!swipe) return;
    const t = e.touches[0];
    swipe.dx = t.clientX - swipe.sx;
    swipe.dy = t.clientY - swipe.sy;
    if(!swipe.locked){
      if(Math.abs(swipe.dx) > Math.abs(swipe.dy)) swipe.locked = true;
      else return;
    }
    if(!swipe.active){
      if(Math.abs(swipe.dx) < 10) return;
      swipe.active = true;
      wrap.style.transition = 'none';
    }
    let disp = swipe.dx;
    if(!curCard) return;
    if((curCard.idx === 0 && disp > 0) || (curCard.idx === ctx.cards.length-1 && disp < 0)){
      disp = swipe.dx * 0.85;
    }
    wrap.style.transform = 'translateX(' + disp + 'px)';
  }, {passive:true});
  wrap.addEventListener('touchend', ()=>{
    if(!swipe) return;
    if(swiping){ swipe = null; return; }   // 切换动画进行中，忽略新滑动
    const dx = swipe.dx;
    const active = swipe.active;
    const vel = Math.abs(dx) / Math.max(1, Date.now() - swipe.t0);
    swipe = null;
    if(!active || !curCard) return;
    const threshold = Math.max(60, window.innerWidth * 0.25);
    const flick = (Math.abs(dx) > 40 && vel > 0.5);
    const goNext = dx < -threshold || (flick && dx < -40);
    const goPrev = dx > threshold || (flick && dx > 40);
    if(goNext && curCard.idx < ctx.cards.length-1){
      finishSwipe(-1);
    } else if(goPrev && curCard.idx > 0){
      finishSwipe(1);
    } else {
      wrap.style.transition = 'transform 0.3s ease';
      wrap.style.transform = 'translateX(0)';
    }
  }, {passive:true});
}
function finishSwipe(dir){
  if(swiping) return;
  swiping = true;
  const wrap = document.getElementById('swipeWrap');
  const curIdx = curCard ? curCard.idx : 0;
  const newIdx = curIdx + (dir === -1 ? 1 : -1);
  wrap.style.transition = 'transform 0.25s ease';
  wrap.style.transform = 'translateX(' + (dir === -1 ? '-100%' : '100%') + ')';
  setTimeout(async ()=>{
    await openChat(newIdx, true);
    wrap.style.transition = 'none';
    wrap.style.transform = 'translateX(' + (dir === -1 ? '100%' : '-100%') + ')';
    void wrap.offsetWidth;
    wrap.style.transition = 'transform 0.25s ease';
    wrap.style.transform = 'translateX(0)';
    swiping = false;
  }, 260);
}
function addMsg(role, text, save){
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  document.getElementById('msgs').appendChild(d);
  document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
  if(save && curCard){
    const apiRole = role === 'ai' ? 'assistant' : role;
    curMsgs.push({role: apiRole, content:text});
    saveThread(threadId(curCard.ctxKey, curCard.idx), curMsgs);
  }
}
async function ask(){
  const q = document.getElementById('q').value.trim();
  if(!q || !curCard){ return; }
  const askKey = curCard.ctxKey + '_' + curCard.idx;
  if(pendingCards[askKey]){ return; }   // 同一张卡不重复提问
  const reqCtxKey = curCard.ctxKey;     // 捕获发起时的卡片标识（滑走后 curCard 会变）
  const reqIdx = curCard.idx;
  addMsg('user', q, true);
  document.getElementById('q').value = '';
  const key = curCard.ctxKey;
  const card_idx = curCard.idx;
  const history = curMsgs.slice(-12).map(m=>({role:(m.role==='ai'?'assistant':m.role), content:(m.content||'').slice(0,800)}));
  // 发送按钮状态 + 提示音
  pendingCards[askKey] = true;
  const sendBtn = document.getElementById('sendBtn');
  sendBtn.classList.add('sending');
  playTone(1400, 0.06, 'triangle', 0.05);
  // 思考中气泡 + 实时等待计时
  const thinkEl = document.createElement('div');
  thinkEl.className = 'msg ai thinking';
  thinkEl.textContent = '🤔 正在思考…';
  document.getElementById('msgs').appendChild(thinkEl);
  document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
  const waitStart = Date.now();
  const avg = avgLatency();
  const waitTimer = setInterval(()=>{
    const sec = Math.round((Date.now() - waitStart) / 1000);
    thinkEl.textContent = '🤔 正在思考… 已等待 ' + sec + ' 秒'
      + (avg ? '（上次平均约 ' + avg + ' 秒）' : '');
    document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
  }, 1000);
  try{
    const r = await fetch(API + '/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key,question:q,history,card_idx,mode:qaMode})});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    thinkEl.remove();
    clearInterval(waitTimer);
    recordLatency(Math.round((Date.now() - waitStart) / 1000));
    const stillHere = (curCard && curCard.ctxKey === reqCtxKey && curCard.idx === reqIdx);
    const full = d.answer || '（无回答）';
    // 无论是否还在当前卡，都写入该卡历史（用捕获的 reqCtxKey/reqIdx）
    const savedMsgs = (await loadThread(threadId(reqCtxKey, reqIdx))) || [];
    savedMsgs.push({role:'assistant', content: full});
    saveThread(threadId(reqCtxKey, reqIdx), savedMsgs);
    if(stillHere){
      // 打字机效果逐字显示
      const aiEl = document.createElement('div');
      aiEl.className = 'msg ai';
      document.getElementById('msgs').appendChild(aiEl);
      let i = 0;
      const CHUNK = 3;
      const timer = setInterval(()=>{
        i += CHUNK;
        aiEl.textContent = full.slice(0, i);
        document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
        if(i >= full.length){ clearInterval(timer); delete pendingCards[askKey]; sendBtn.classList.remove('sending'); playChime(); }
      }, 16);
    } else {
      delete pendingCards[askKey];
    }
  }catch(e){
    thinkEl.remove();
    clearInterval(waitTimer);
    if(curCard && curCard.ctxKey === reqCtxKey && curCard.idx === reqIdx){
      addMsg('ai', '提问失败: ' + e.message + '，网络不稳定时请稍后重试', true);
      sendBtn.classList.remove('sending');
    }
    delete pendingCards[askKey];
  }
}

// ── 搜索 ──
async function doSearch(){
  const kw = document.getElementById('skw').value.trim();
  if(!kw) return;
  const box = document.getElementById('sres');
  box.innerHTML = '搜索中…';
  try{
    const r = await fetch(API + '/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword:kw})});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    box.innerHTML = d.cards.length
      ? d.cards.map((c,i)=>`<div class="gcard" style="margin-bottom:8px" onclick="window.open('${c.url||'#'}','_blank')"><h3>${esc(c.title)}</h3><p>${esc(c.summary)}</p></div>`).join('')
      : '未找到相关内容';
  }catch(e){
    box.innerHTML = '搜索失败: ' + esc(e.message);
  }
}

(async function init(){
  await openDB();
  initSwipe();
  if(KEYS.length){
    renderSessionLists();
    // 默认选中今日最新一期
    const today = todayStr();
    const todayKeys = KEYS.filter(k=>k.startsWith(today));
    const target = todayKeys.length ? todayKeys[todayKeys.length-1] : KEYS[0];
    pickKey(target);
  } else {
    document.getElementById('grid').innerHTML = '<div class="loading">暂无新闻数据，请等下一期日报生成</div>';
  }
})();
</script>
